name: 🤖 Monthly Data Refresh (Backup)

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📊 World Bank historical data
        run: python scripts/update_history.py
        continue-on-error: true

      - name: ⚽ FIFA rankings
        run: python scripts/update_fifa.py
        continue-on-error: true

      - name: 🧹 Analyze rankings
        run: |
          if [ -f analyze_rankings.py ]; then
            python analyze_rankings.py || echo "⚠️ skipped"
          fi

      - name: 📊 Update site_meta
        run: |
          python3 scripts/update_site_meta.py

      - name: ✅ Commit & Push
        run: |
          git config user.name "Rankerage Bot"
          git config user.email "bot@rankerage.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "✅ No changes"
          else
            git commit -m "🤖 Weekly refresh: $(date +%Y-%m-%d)"
            git push
          fi
