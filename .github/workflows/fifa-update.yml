{
  "name": "Weekly FIFA Ranking Update",
  "on": {
    "schedule": [
      {
        "cron": "0 9 * * 1"
      }
    ],
    "workflow_dispatch": null
  },
  "jobs": {
    "update": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-python@v5",
          "with": {
            "python-version": "3.11"
          }
        },
        {
          "name": "Run updater",
          "run": "python scripts/update_fifa.py"
        },
        {
          "name": "Commit changes",
          "run": "git config user.name 'github-actions' && git config user.email 'actions@github.com' && git add docs/data/countries.json && git diff --staged --quiet || (git commit -m 'Weekly FIFA update' && git push)"
        }
      ]
    }
  }
}