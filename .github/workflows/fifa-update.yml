name: ⚽ FIFA Ranking Update

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: ⚽ Update FIFA rankings
        run: python scripts/update_fifa.py

      - name: 📊 Update site_meta
        run: python scripts/update_site_meta.py

      - name: ✅ Commit & Push
        run: |
          git config user.name "Rankerage Bot"
          git config user.email "bot@rankerage.com"
          git add docs/data/
          if git diff --staged --quiet; then
            echo "✅ No changes"
          else
            git commit -m "⚽ FIFA rankings update: $(date +%Y-%m-%d)"
            git push
          fi
